<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergunta</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <img src="https://cdn3.emoji.gg/emojis/8542-rose-in-mouth.png" alt="Emoji segurando flor" style="width: 100px; height: 100px; margin-bottom: 50px;">
    <h1>Você quer sair comigo?</h1>
    <div class="buttons">
        <button class="sim" onclick="showFireworks()">Sim</button>
        <button class="nao" id="nao" onclick="moveButton()">Não</button>
    </div>
    <div id="hearts" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; display: none;"></div>
    <script>
        function showFireworks() {
            var container = document.getElementById('hearts');
            container.style.display = 'block';
            for (let i = 0; i < 50; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(heart);
            }
            setTimeout(() => {
                container.innerHTML = '';
                container.style.display = 'none';
            }, 4000);
        }
        function moveButton() {
            var btn = document.getElementById('nao');
            btn.style.position = 'absolute';
            btn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            btn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
        }
    </script>
</body>
</html>
